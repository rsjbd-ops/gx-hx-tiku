<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b6bcb">
<title>广西航线刷题</title>
<style>
  :root{
    --bg:#f1f3f7; --card:#fff; --fg:#14181f; --muted:#6b7280; --line:#e2e6ec;
    --pri:#0b6bcb; --pri-soft:#e7f1fc;
    --ok:#0f7a46; --ok-bg:#e6f6ec; --ok-line:#93d5af;
    --bad:#c0271f; --bad-bg:#fdeceb; --bad-line:#f0aaa4;
    --r:14px; --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1116; --card:#181d24; --fg:#e8ecf2; --muted:#98a1ae; --line:#262c35;
      --pri:#5aa2f0; --pri-soft:#16283c;
      --ok:#54c98d; --ok-bg:#102c1d; --ok-line:#2c6b49;
      --bad:#ff7268; --bad-bg:#391a17; --bad-line:#7c3a33;
      --shadow:none;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--fg);
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",sans-serif;
    -webkit-text-size-adjust:100%;
    touch-action:manipulation;
    overscroll-behavior-y:contain;
  }
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  #app{max-width:840px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

  /* ---------- header ---------- */
  .hd{
    position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);
    padding:calc(8px + env(safe-area-inset-top)) 14px 9px;box-shadow:var(--shadow);
  }
  .hd-row{display:flex;align-items:center;gap:10px}
  .hd-row + .hd-row{margin-top:8px}
  .hd-title{font-weight:650;font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hd-sub{font-size:12.5px;color:var(--muted);white-space:nowrap}
  .hd-sub strong{color:var(--pri);font-weight:650}

  /* ---------- main ---------- */
  .main{flex:1;padding:14px 14px 18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
  .card-hd{padding:14px 14px 10px}
  .card-title{font-weight:650;font-size:16px}
  .card-sub{font-size:12.5px;color:var(--muted);margin-top:3px}

  /* ---------- chapter list ---------- */
  .ch{
    display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;
    width:100%;text-align:left;padding:12px 14px;border-top:1px solid var(--line);
  }
  .ch:active{background:var(--pri-soft)}
  .ch-name{font-size:15.5px;font-weight:500}
  .ch-meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .bar{grid-column:1/-1;height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:7px}
  .bar>i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .25s}

  /* ---------- segmented ---------- */
  .segwrap{display:flex;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:3px}
  .seg{min-height:34px;padding:0 14px;border-radius:8px;font-size:14px;font-weight:500;color:var(--muted)}
  .seg.on{background:var(--card);color:var(--pri);font-weight:650;box-shadow:var(--shadow)}

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    min-height:46px;padding:0 18px;border-radius:12px;
    background:var(--card);border:1px solid var(--line);
    font-size:15.5px;font-weight:550;
  }
  .btn:active{transform:scale(.985)}
  .btn.pri{background:var(--pri);color:#fff;border-color:transparent}
  .btn.ghost{background:transparent;color:var(--muted);border-color:var(--line)}
  .btn.sm{min-height:44px;padding:0 14px;font-size:14.5px;border-radius:10px}
  .btn[disabled]{opacity:.4;pointer-events:none}

  /* ---------- question ---------- */
  .qcard{padding:16px 14px 14px}
  .qno{font-size:12.5px;color:var(--muted);margin-bottom:8px;font-variant-numeric:tabular-nums}
  .stem{font-size:17.5px;line-height:1.72;font-weight:550;letter-spacing:.2px}
  .stem .bk{color:var(--pri);font-weight:700}
  .opts{margin-top:16px}
  .opt{
    display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;
    padding:13px 14px;margin-bottom:10px;border-radius:12px;
    border:1.5px solid var(--line);background:var(--card);
    font-size:16px;line-height:1.55;transition:background .15s,border-color .15s;
  }
  .opt:last-child{margin-bottom:0}
  .opt:active{transform:scale(.995)}
  .opt .tag{
    flex:0 0 auto;width:27px;height:27px;border-radius:8px;background:var(--pri-soft);color:var(--pri);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;margin-top:1px;
  }
  .opt .ot{flex:1;min-width:0;word-break:break-word}
  .opt .mk{flex:0 0 auto;font-weight:800;font-size:17px;margin-left:4px}
  .opt.ok{border-color:var(--ok-line);background:var(--ok-bg)}
  .opt.ok .tag{background:var(--ok);color:#fff}
  .opt.ok .mk{color:var(--ok)}
  .opt.bad{border-color:var(--bad-line);background:var(--bad-bg)}
  .opt.bad .tag{background:var(--bad);color:#fff}
  .opt.bad .mk{color:var(--bad)}
  .opt.judge{justify-content:center;font-size:17px;font-weight:600;padding:16px 14px}
  .opt.judge .ot{flex:0 0 auto}

  /* ---------- result ---------- */
  .res{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:15.5px;line-height:1.6}
  .res.ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line)}
  .res.bad{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad-line)}
  .res b{font-weight:700}
  .res .note{margin-top:7px;font-size:13px;font-weight:400;color:var(--muted);line-height:1.55}
  .res.ref{background:var(--pri-soft);color:var(--fg);border:1px solid var(--line);white-space:pre-wrap}

  /* ---------- 题目配图 ---------- */
  .fig{margin-top:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0d1014;position:relative;cursor:zoom-in}
  .fig img{display:block;width:100%;max-width:600px;margin:0 auto;height:auto;max-height:44vh;object-fit:contain}
  .fig .zoomhint{position:absolute;right:8px;bottom:8px;font-size:12px;color:#fff;background:rgba(0,0,0,.6);padding:3px 9px;border-radius:99px;pointer-events:none}
  .fig.figerr{display:flex;align-items:center;justify-content:center;min-height:86px;cursor:default}
  .fig.figerr img,.fig.figerr .zoomhint{display:none}
  .fig.figerr::after{content:'配图加载失败';color:var(--muted);font-size:13px}
  .lightbox{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;padding:10px;cursor:zoom-out}
  .lightbox img{max-width:100%;max-height:100%;object-fit:contain}
  .lightbox .lb-close{position:absolute;top:calc(10px + env(safe-area-inset-top));right:14px;color:#fff;font-size:14.5px;background:rgba(255,255,255,.16);border-radius:99px;padding:9px 15px}

  /* ---------- footer ---------- */
  .ft{
    position:sticky;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
    padding:9px 14px calc(9px + env(safe-area-inset-bottom));display:flex;gap:10px;
  }
  .ft .btn{flex:1}
  .empty{padding:48px 14px;text-align:center;color:var(--muted);font-size:15px}
  .hint{font-size:12.5px;color:var(--muted);text-align:center;padding:2px 0 12px}

  /* ---------- wide screens (tablet / desktop) ---------- */
  @media (min-width:700px){
    .main{padding:18px 18px 24px}
    .stem{font-size:18px}
    .opt{padding:15px 16px}
    .opt.judge{font-size:18px}
    .ft{padding-left:18px;padding-right:18px}
  }
</style>
</head>

/* ============ 进度存储 ============ */
const KEY = 'hxbank.v1';
const CAN_SAVE = (() => { try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); return true; } catch(e){ return false; } })();
let store = loadStore();
function loadStore(){
  try { const o = JSON.parse(localStorage.getItem(KEY)); if (o && o.ans) return o; } catch(e){}
  return { ans: {} };
}
function saveStore(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} }

/* ============ 运行状态 ============ */
const S = { view:'home', routeId:null, chapterId:null, mode:'seq', queue:[], idx:0, reveal:false };

/* ============ 工具 ============ */
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmtStem(s){
  return esc(s)
    .replace(/_{2,}/g, '<span class="bk">$&</span>')
    .replace(/（\s*）/g, '<span class="bk">（　　）</span>');
}
function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const getRoute = id => BANK.routes.find(r => r.id === id);
const getChapter = (rid, cid) => { const r = getRoute(rid); return r && r.chapters.find(c => c.id === cid); };
const isObj = q => q.type !== 'subjective';
const pct = (a, b) => b ? Math.round(a * 100 / b) : 0;

function chapterStat(ch){
  let done = 0, ok = 0, total = 0;
  ch.questions.forEach(q => {
    if (!isObj(q)) return;
    total++;
    const a = store.ans[q.id];
    if (a){ done++; if (a.ok) ok++; }
  });
  return { done, ok, total };
}
function routeStat(r){
  const t = { done:0, ok:0, total:0 };
  r.chapters.forEach(ch => { const s = chapterStat(ch); t.done += s.done; t.ok += s.ok; t.total += s.total; });
  return t;
}
function queueStat(){
  let done = 0, ok = 0;
  S.queue.forEach(q => {
    if (!isObj(q)) return;
    const a = store.ans[q.id];
    if (a){ done++; if (a.ok) ok++; }
  });
  return { done, ok };
}

/* ============ 视图：首页 ============ */
function viewHome(){
  const cards = BANK.routes.map(r => {
    const rs = routeStat(r);
    const total = r.chapters.reduce((n, c) => n + c.questions.length, 0);
    const rows = r.chapters.map(ch => {
      const s = chapterStat(ch);
      return `<button class="ch" data-act="open" data-r="${r.id}" data-c="${ch.id}">
        <span class="ch-name">${esc(ch.name)}</span>
        <span class="ch-meta">${s.done}/${s.total}${s.done ? ' · ' + pct(s.ok, s.done) + '%' : ''}</span>
        <span class="bar"><i style="width:${pct(s.done, s.total)}%"></i></span>
      </button>`;
    }).join('');
    return `<section class="card">
      <div class="card-hd">
        <div class="card-title">${esc(r.name)}</div>
        <div class="card-sub">${r.chapters.length} 个航段 · 共 ${total} 题 · 已做 ${rs.done}/${rs.total}${rs.done ? ' · 正确率 ' + pct(rs.ok, rs.done) + '%' : ''}</div>
      </div>
      ${rows}
    </section>`;
  }).join('');

  const t = BANK.routes.reduce((a, r) => { const s = routeStat(r); a.done += s.done; a.ok += s.ok; a.total += s.total; return a; }, { done:0, ok:0, total:0 });

  return `<header class="hd">
      <div class="hd-row"><div class="hd-title">广西航线刷题</div></div>
      <div class="hd-row"><div class="hd-sub">总进度 <strong>${t.done}</strong>/${t.total} 题${t.done ? ' · 正确率 <strong>' + pct(t.ok, t.done) + '%</strong>' : ''}</div></div>
    </header>
    <main class="main">
      ${cards}
      <div class="hint">点击航段即可开始练习，答题后立即显示答案${CAN_SAVE ? '' : '（当前打开方式无法保存进度）'}</div>
      <div style="text-align:center"><button class="btn ghost sm" data-act="reset">重置全部进度</button></div>
    </main>`;
}

/* ============ 视图：练习 ============ */
function buildQueue(){
  const ch = getChapter(S.routeId, S.chapterId);
  let qs = ch.questions.slice();
  if (S.mode === 'rand') qs = shuffle(qs);
  else if (S.mode === 'wrong') qs = qs.filter(q => { const a = store.ans[q.id]; return a && !a.ok; });
  S.queue = qs;
  S.idx = 0;
  if (S.mode === 'seq'){
    const i = qs.findIndex(q => !store.ans[q.id]);
    if (i >= 0) S.idx = i;
  }
}

function qCard(q){
  const a = store.ans[q.id];
  const answered = !!a && isObj(q);
  const judge = q.type === 'judge';
  let body = '';

  if (q.type === 'subjective'){
    body = `<button class="btn pri" data-act="reveal" style="width:100%">${S.reveal ? '收起参考答案' : '查看参考答案'}</button>
      ${S.reveal ? `<div class="res ref">${esc(q.ref || '（本题库未收录参考答案）')}</div>` : ''}`;
  } else {
    body = `<div class="opts">` + q.options.map((t, i) => {
      let cls = 'opt' + (judge ? ' judge' : '');
      if (answered){
        if (i === q.answer) cls += ' ok';
        else if (i === a.c) cls += ' bad';
      }
      const tag = judge ? '' : `<span class="tag">${'ABCDEFGH'[i] || (i + 1)}</span>`;
      const mk = answered && i === q.answer ? '<span class="mk">✓</span>'
               : answered && i === a.c ? '<span class="mk">✗</span>' : '';
      return `<button class="${cls}" data-act="pick" data-i="${i}">${tag}<span class="ot">${esc(t)}</span>${mk}</button>`;
    }).join('') + `</div>`;
  }

  let res = '';
  if (answered){
    const ansText = q.options[q.answer] != null ? q.options[q.answer] : '';
    res = `<div class="res ${a.ok ? 'ok' : 'bad'}">${a.ok ? '✓ 答对了' : '✗ 答错了　正确答案：<b>' + esc(ansText) + '</b>'}
      ${q.note ? `<div class="note">⚠ ${esc(q.note)}</div>` : ''}</div>`;
  }

  const fig = q.img
    ? `<div class="fig" data-act="zoom" data-src="${esc(q.img)}"><img src="${esc(q.img)}" alt="题目配图" loading="lazy" decoding="async"><span class="zoomhint">点击放大</span></div>`
    : '';

  return `<div class="card qcard">
      <div class="qno">第 ${S.idx + 1} / ${S.queue.length} 题</div>
      <div class="stem">${fmtStem(q.stem)}</div>
      ${fig}
      ${body}
      ${res}
    </div>`;
}

function viewQuiz(){
  const ch = getChapter(S.routeId, S.chapterId);
  const q = S.queue[S.idx];
  const st = queueStat();
  const seg = (m, label) => `<button class="seg ${S.mode === m ? 'on' : ''}" data-act="mode" data-m="${m}">${label}</button>`;
  const body = q ? qCard(q) : `<div class="empty">${S.mode === 'wrong' ? '本章节暂无错题 🎉' : '本章节暂无题目'}</div>`;

  return `<header class="hd">
      <div class="hd-row">
        <button class="btn ghost sm" data-act="back">← 返回</button>
        <div class="hd-title">${esc(ch.name)}</div>
        <div class="hd-sub">${st.done ? '正确率 <strong>' + pct(st.ok, st.done) + '%</strong>' : ''}</div>
      </div>
      <div class="hd-row">
        <div class="segwrap">${seg('seq', '顺序')}${seg('rand', '随机')}${seg('wrong', '错题')}</div>
      </div>
    </header>
    <main class="main">${body}</main>
    <footer class="ft">
      <button class="btn" data-act="prev" ${(!q || S.idx <= 0) ? 'disabled' : ''}>上一题</button>
      <button class="btn pri" data-act="next" ${(!q || S.idx >= S.queue.length - 1) ? 'disabled' : ''}>下一题</button>
    </footer>`;
}

/* ============ 渲染 ============ */
function render(){
  document.getElementById('app').innerHTML = (S.view === 'home') ? viewHome() : viewQuiz();
}

/* ============ 交互 ============ */
function pick(i){
  const q = S.queue[S.idx];
  if (!q || !isObj(q)) return;
  if (i < 0 || i >= q.options.length) return;
  const prev = store.ans[q.id];
  if (prev && prev.c === i) return;
  store.ans[q.id] = { c: i, ok: i === q.answer };
  saveStore();
  render();
}
function go(step){
  const n = S.idx + step;
  if (n < 0 || n >= S.queue.length) return;
  S.idx = n; S.reveal = false;
  render();
  window.scrollTo(0, 0);
}

function openZoom(src){
  if (!src) return;
  const d = document.createElement('div');
  d.className = 'lightbox';
  d.innerHTML = '<button class="lb-close">关闭</button><img alt="题目配图">';
  d.querySelector('img').src = src;
  d.addEventListener('click', () => d.remove());
  document.body.appendChild(d);
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  if (act === 'open'){
    S.routeId = b.dataset.r; S.chapterId = b.dataset.c;
    S.mode = 'seq'; S.reveal = false;
    buildQueue(); S.view = 'quiz'; render(); window.scrollTo(0, 0);
  } else if (act === 'back'){
    S.view = 'home'; render(); window.scrollTo(0, 0);
  } else if (act === 'mode'){
    if (S.mode === b.dataset.m) return;
    S.mode = b.dataset.m; S.reveal = false;
    buildQueue(); render(); window.scrollTo(0, 0);
  } else if (act === 'pick'){
    pick(Number(b.dataset.i));
  } else if (act === 'reveal'){
    S.reveal = !S.reveal; render();
  } else if (act === 'zoom'){
    openZoom(b.dataset.src);
  } else if (act === 'prev'){
    go(-1);
  } else if (act === 'next'){
    go(1);
  } else if (act === 'reset'){
    if (window.confirm('确定要清空全部答题记录吗？此操作不可恢复。')){
      store = { ans: {} }; saveStore(); render();
    }
  }
});

document.addEventListener('error', e => {
  const el = e.target;
  if (el && el.tagName === 'IMG' && el.parentElement && el.parentElement.classList.contains('fig')){
    el.parentElement.classList.add('figerr');
  }
}, true);

document.addEventListener('keydown', e => {
  if (S.view !== 'quiz') return;
  const q = S.queue[S.idx];
  if (!q) return;
  if (isObj(q)){
    const letter = 'ABCDEFGH'.indexOf(e.key.toUpperCase());
    const num = /^[1-8]$/.test(e.key) ? Number(e.key) - 1 : -1;
    const i = letter >= 0 ? letter : num;
    if (i >= 0 && i < q.options.length){ e.preventDefault(); pick(i); return; }
  } else if (e.key === 'Enter' || e.key === ' '){
    e.preventDefault(); S.reveal = !S.reveal; render(); return;
  }
  if (e.key === 'ArrowRight' || e.key === 'Enter' || e.key === ' '){ e.preventDefault(); go(1); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); go(-1); }
});

render();
</script>
</body>
</html>
